<style>
*{box-sizing:border-box;margin:0;padding:0}
.game{padding:1rem;max-width:680px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.hud-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.6rem 1rem;text-align:center}
.hud-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:2px}
.hud-val{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.tabs{display:flex;gap:8px;margin-bottom:1rem}
.tab{flex:1;padding:.5rem;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;font-size:14px;font-weight:500;color:var(--color-text-secondary);transition:.15s}
.tab.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.panel{display:none}
.panel.active{display:block}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.shop-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:.9rem;text-align:center}
.shop-emoji{font-size:28px;display:block;margin-bottom:6px}
.shop-name{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px}
.shop-meta{font-size:11px;color:var(--color-text-secondary);margin-bottom:6px;line-height:1.5}
.shop-price{font-size:13px;font-weight:500;color:var(--color-text-success);margin-bottom:8px}
.stock-bar{height:4px;background:var(--color-border-tertiary);border-radius:2px;margin-bottom:8px;overflow:hidden}
.stock-fill{height:100%;border-radius:2px;transition:.4s}
.btn{display:inline-block;padding:.35rem .9rem;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;cursor:pointer;font-size:13px;color:var(--color-text-primary);transition:.15s}
.btn:hover{background:var(--color-background-secondary)}
.btn-green{border-color:var(--color-border-success);color:var(--color-text-success)}
.btn-green:hover{background:var(--color-background-success)}
.btn-amber{border-color:var(--color-border-warning);color:var(--color-text-warning)}
.btn-amber:hover{background:var(--color-background-warning)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.garden-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1rem}
.plot{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;min-height:80px;position:relative;padding:4px}
.plot:hover{border-color:var(--color-border-secondary)}
.plot-emoji{font-size:24px;line-height:1}
.plot-label{font-size:11px;color:var(--color-text-secondary);margin-top:3px;text-align:center}
.plot-empty-label{font-size:15px;font-weight:500;color:var(--color-text-tertiary)}
.progress-bar{position:absolute;bottom:5px;left:7px;right:7px;height:3px;background:var(--color-border-tertiary);border-radius:2px}
.progress-fill{height:100%;background:#639922;border-radius:2px;transition:.5s}
.sell-list{display:flex;flex-direction:column;gap:8px}
.sell-row{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:.75rem 1rem;display:flex;align-items:center;gap:12px}
.sell-emoji{font-size:24px}
.sell-info{flex:1}
.sell-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.sell-count{font-size:12px;color:var(--color-text-secondary)}
.sell-val{font-size:14px;font-weight:500;color:var(--color-text-success);margin-right:8px}
.msg{font-size:13px;color:var(--color-text-secondary);padding:.4rem 0}
.seed-select{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:.75rem 1rem;margin-bottom:.75rem}
.seed-select-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:.5rem}
.seed-options{display:flex;flex-wrap:wrap;gap:6px}
.seed-opt{padding:.3rem .7rem;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;font-size:13px;color:var(--color-text-secondary);transition:.15s}
.seed-opt:hover{border-color:var(--color-border-info);color:var(--color-text-info)}
.restock-timer{font-size:11px;color:var(--color-text-secondary);margin-top:4px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:.5rem 1.25rem;font-size:13px;color:var(--color-text-primary);z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.out-badge{font-size:11px;padding:2px 8px;border-radius:var(--border-radius-md);background:var(--color-background-danger);color:var(--color-text-danger);display:inline-block;margin-bottom:4px}
</style>

<div class="game">
<div class="hud">
  <div class="hud-card"><div class="hud-label">Money</div><div class="hud-val" id="money">$20</div></div>
  <div class="hud-card"><div class="hud-label">Plots used</div><div class="hud-val" id="plots-used">0 / 15</div></div>
  <div class="hud-card"><div class="hud-label">Harvested</div><div class="hud-val" id="harvest-count">0</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('garden')">Garden</button>
  <button class="tab" onclick="switchTab('seeds')">Seeds Shop</button>
  <button class="tab" onclick="switchTab('sell')">Sell Shop</button>
</div>

<div id="tab-garden" class="panel active">
  <div id="seed-selector" class="seed-select" style="display:none">
    <div class="seed-select-title">Choose a seed to plant:</div>
    <div class="seed-options" id="seed-options"></div>
    <button class="btn" style="margin-top:.5rem;font-size:12px" onclick="cancelPlant()">Cancel</button>
  </div>
  <div class="garden-grid" id="garden"></div>
  <p class="msg">Click an empty plot to plant a seed. Watch the bar fill — then click again to harvest!</p>
</div>

<div id="tab-seeds" class="panel">
  <div class="shop-grid" id="seeds-shop"></div>
</div>

<div id="tab-sell" class="panel">
  <div class="sell-list" id="sell-list"></div>
  <p class="msg" id="sell-msg" style="display:none">No crops to sell yet. Grow something first!</p>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SEEDS=[
  {id:'carrot',name:'Carrot',emoji:'🥕',cost:10,growTime:15,sellPrice:20,maxStock:5,restockTime:30},
  {id:'tomato',name:'Tomato',emoji:'🍅',cost:50,growTime:25,sellPrice:60,maxStock:4,restockTime:45},
  {id:'corn',name:'Corn',emoji:'🌽',cost:100,growTime:35,sellPrice:120,maxStock:4,restockTime:60},
  {id:'watermelon',name:'Watermelon',emoji:'🍉',cost:150,growTime:55,sellPrice:200,maxStock:3,restockTime:90},
  {id:'strawberry',name:'Strawberry',emoji:'🍓',cost:300,growTime:30,sellPrice:400,maxStock:3,restockTime:120},
  {id:'pumpkin',name:'Pumpkin',emoji:'🎃',cost:500,growTime:70,sellPrice:600,maxStock:2,restockTime:180},
  {id:'dragonfruit',name:'Dragon Fruit',emoji:'🐉',cost:1000,growTime:120,sellPrice:1500,maxStock:1,restockTime:300},
];

let money=20,inventory={},harvest={},plots=Array(15).fill(null),totalHarvest=0;
let shopStock={},restockTimers={},restockCountdowns={};

SEEDS.forEach(s=>{inventory[s.id]=0;harvest[s.id]=0;shopStock[s.id]=s.maxStock;});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function fmt(n){return '$'+n.toLocaleString();}

function updateHUD(){
  document.getElementById('money').textContent=fmt(money);
  document.getElementById('plots-used').textContent=plots.filter(p=>p!==null).length+' / 15';
  document.getElementById('harvest-count').textContent=totalHarvest;
}

function startRestock(seedId){
  const seed=SEEDS.find(s=>s.id===seedId);
  if(restockTimers[seedId])return;
  let remaining=seed.restockTime;
  restockCountdowns[seedId]=remaining;
  restockTimers[seedId]=setInterval(()=>{
    remaining--;restockCountdowns[seedId]=remaining;
    if(remaining<=0){
      clearInterval(restockTimers[seedId]);delete restockTimers[seedId];delete restockCountdowns[seedId];
      shopStock[seedId]=seed.maxStock;
      toast(`${seed.emoji} ${seed.name} is back in stock!`);renderSeedShop();
    } else {const el=document.getElementById('restock-'+seedId);if(el)el.textContent='Restocks in '+remaining+'s';}
  },1000);
}

function renderGarden(){
  const g=document.getElementById('garden');g.innerHTML='';
  plots.forEach((plot,i)=>{
    const div=document.createElement('div');div.className='plot';
    if(!plot){
      div.innerHTML='<span class="plot-empty-label">Empty</span>';
      div.onclick=()=>openPlantMenu(i);
    } else if(plot.state==='growing'){
      const pct=Math.min(100,Math.round(((Date.now()-plot.plantedAt)/plot.growMs)*100));
      div.innerHTML=`<span class="plot-emoji">${plot.emoji}</span><span class="plot-label">Growing…</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    } else {
      div.innerHTML=`<span class="plot-emoji">${plot.emoji}</span><span class="plot-label">Ready! Tap to harvest</span>`;
      div.style.borderColor='var(--color-border-success)';div.onclick=()=>harvestPlot(i);
    }
    g.appendChild(div);
  });
}

function renderSeedShop(){
  const s=document.getElementById('seeds-shop');s.innerHTML='';
  SEEDS.forEach(seed=>{
    const stock=shopStock[seed.id],canAfford=money>=seed.cost,inStock=stock>0;
    const d=document.createElement('div');d.className='shop-card';
    const stockPct=Math.round((stock/seed.maxStock)*100);
    const stockColor=stock===0?'#E24B4A':stock<=1?'#EF9F27':'#639922';
    let restockHTML=(!inStock&&restockCountdowns[seed.id]!==undefined)?`<div class="restock-timer" id="restock-${seed.id}">Restocks in ${restockCountdowns[seed.id]}s</div>`:'';
    d.innerHTML=`
      <span class="shop-emoji">${seed.emoji}</span>
      <div class="shop-name">${seed.name}</div>
      <div class="shop-meta">Grows in ~${seed.growTime}s<br>Sells for ${fmt(seed.sellPrice)}</div>
      <div class="shop-price">Buy: ${fmt(seed.cost)}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <div class="stock-bar" style="flex:1"><div class="stock-fill" style="width:${stockPct}%;background:${stockColor}"></div></div>
        <span style="font-size:11px;color:var(--color-text-secondary)">${stock}/${seed.maxStock}</span>
      </div>
      ${!inStock?'<div class="out-badge">Out of stock</div>':''}
      ${restockHTML}
      <div style="margin-top:6px;font-size:11px;color:var(--color-text-secondary)">In bag: ${inventory[seed.id]}</div>
    `;
    const btn=document.createElement('button');
    btn.className='btn btn-green';btn.style.marginTop='8px';btn.textContent='Buy';
    btn.disabled=!canAfford||!inStock;
    btn.onclick=(e)=>{e.stopPropagation();buySeed(seed.id);};
    d.appendChild(btn);s.appendChild(d);
  });
}

function renderSellShop(){
  const list=document.getElementById('sell-list'),msg=document.getElementById('sell-msg');
  list.innerHTML='';
  const hasAny=SEEDS.some(s=>harvest[s.id]>0);
  msg.style.display=hasAny?'none':'block';
  SEEDS.filter(s=>harvest[s.id]>0).forEach(seed=>{
    const row=document.createElement('div');row.className='sell-row';
    row.innerHTML=`
      <span class="sell-emoji">${seed.emoji}</span>
      <div class="sell-info"><div class="sell-name">${seed.name}</div><div class="sell-count">${harvest[seed.id]} ready to sell</div></div>
      <span class="sell-val">${fmt(seed.sellPrice*harvest[seed.id])}</span>
    `;
    const btn=document.createElement('button');btn.className='btn btn-amber';btn.textContent='Sell all';
    btn.onclick=()=>sellCrop(seed.id);row.appendChild(btn);list.appendChild(row);
  });
}

function buySeed(id){
  const seed=SEEDS.find(s=>s.id===id);
  if(money<seed.cost){toast('Not enough money!');return;}
  if(shopStock[id]<=0){toast('Out of stock!');return;}
  money-=seed.cost;inventory[id]++;shopStock[id]--;
  if(shopStock[id]===0)startRestock(id);
  toast(`Bought ${seed.emoji} ${seed.name} seed!`);updateHUD();renderSeedShop();
}

function openPlantMenu(plotIdx){
  if(!SEEDS.some(s=>inventory[s.id]>0)){toast('No seeds! Buy some first.');return;}
  document.getElementById('seed-selector').style.display='block';
  const opts=document.getElementById('seed-options');opts.innerHTML='';
  SEEDS.filter(s=>inventory[s.id]>0).forEach(seed=>{
    const btn=document.createElement('button');btn.className='seed-opt';
    btn.textContent=`${seed.emoji} ${seed.name} (${inventory[seed.id]})`;
    btn.onclick=()=>plantSeed(plotIdx,seed.id);opts.appendChild(btn);
  });
}

function cancelPlant(){document.getElementById('seed-selector').style.display='none';}

function plantSeed(plotIdx,seedId){
  const seed=SEEDS.find(s=>s.id===seedId);
  if(inventory[seedId]<=0){toast('No seeds of that type!');return;}
  inventory[seedId]--;
  plots[plotIdx]={id:seedId,name:seed.name,emoji:seed.emoji,state:'growing',plantedAt:Date.now(),growMs:seed.growTime*1000};
  document.getElementById('seed-selector').style.display='none';
  setTimeout(()=>{
    if(plots[plotIdx]&&plots[plotIdx].state==='growing'){plots[plotIdx].state='ready';renderGarden();toast(`${seed.emoji} ${seed.name} is ready to harvest!`);}
  },seed.growTime*1000);
  const iv=setInterval(()=>{if(!plots[plotIdx]||plots[plotIdx].state!=='growing'){clearInterval(iv);return;}renderGarden();},1500);
  updateHUD();renderGarden();toast(`Planted ${seed.emoji} ${seed.name}!`);
}

function harvestPlot(plotIdx){
  const plot=plots[plotIdx];if(!plot||plot.state!=='ready')return;
  harvest[plot.id]++;totalHarvest++;plots[plotIdx]=null;
  updateHUD();renderGarden();renderSellShop();toast(`Harvested ${plot.emoji} ${plot.name}!`);
}

function sellCrop(id){
  const seed=SEEDS.find(s=>s.id===id);
  const earned=seed.sellPrice*harvest[id];money+=earned;harvest[id]=0;
  toast(`Sold for ${fmt(earned)}!`);updateHUD();renderSeedShop();renderSellShop();
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['garden','seeds','sell'][i]===tab);});
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='seeds')renderSeedShop();if(tab==='sell')renderSellShop();
}

updateHUD();renderGarden();renderSeedShop();
</script>
